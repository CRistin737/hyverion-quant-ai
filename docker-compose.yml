services:
  bot:
    profiles: ["runtime"]
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      TRADING_MODE: paper
      MARKET_TYPE: spot
      LEVERAGE_ENABLED: "false"
      LIVE_TRADING: "false"
      SHADOW_TRADING: "true"
      TRADING_CAPITAL: ${TRADING_CAPITAL:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///data/trading_bot.db}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  control-api:
    profiles: ["api"]
    build: .
    command: ["python", "-m", "trading_bot", "api", "--host", "0.0.0.0"]
    restart: unless-stopped
    environment:
      APP_ENV: production
      MARKET_TYPE: spot
      LEVERAGE_ENABLED: "false"
      LIVE_TRADING: "false"
      API_ALLOW_REMOTE_BIND: "true"
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///data/trading_bot.db}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # --- Memory backend (opt-in): `docker compose --profile memory up -d` ---
  # PostgreSQL + pgvector is the historical/strategic source of truth once
  # DATABASE_URL points at it. Redis is disposable working memory: no
  # persistence, always rebuilt from the database. Both bind to localhost only.
  postgres:
    profiles: ["memory"]
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hyverion
      POSTGRES_USER: hyverion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - hyverion-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyverion -d hyverion"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    profiles: ["memory"]
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true

volumes:
  hyverion-postgres:
