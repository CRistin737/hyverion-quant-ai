[package]
name = "hyverion-desktop"
version = "0.2.0"
description = "Hyverion Quant AI desktop shell"
authors = ["Cristian Santos"]
license = "Apache-2.0"
repository = "https://github.com/CRistin737/hyverion-quant-ai"
homepage = "https://cristin737.github.io/hyverion-quant-ai"
edition = "2021"
rust-version = "1.80"

[lib]
name = "hyverion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native"] }
getrandom = "0.3"
reqwest = { version = "0.13.3", default-features = false, features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
