name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos-app:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like 1.2.3 or 1.2.3-rc.1 (got '$VERSION')"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra desktop-build
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm build:app
        working-directory: app
      - name: Collect the .dmg
        id: dmg
        run: |
          dmg="$(find app/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          if [ -z "$dmg" ]; then
            echo "::error::no .dmg produced by pnpm build:app"
            exit 1
          fi
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version }}
          name: Hyverion Quant AI v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          fail_on_unmatched_files: true
          files: ${{ steps.dmg.outputs.path }}
          generate_release_notes: true
          body: |
            macOS build of Hyverion Quant AI v${{ inputs.version }} (PAPER trading only; LIVE stays locked).

            **Unsigned build.** This .dmg is not signed with an Apple Developer ID nor notarized.
            macOS Gatekeeper will warn on first launch: right-click the app and choose "Open",
            or allow it in System Settings > Privacy & Security. Verify the download against the
            checksum GitHub shows for the asset, and build from source if you prefer.
